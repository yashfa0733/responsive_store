<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="ShopSpace e-commerce frontend"><title>Checkout | ShopSpace</title><link rel="stylesheet" href="css/style.css"><script defer src="js/app.js"></script></head><body><header class="top"><a class="logo" href="index.html"><i>S</i> shop<span>space</span></a><button class="menu" aria-label="Open menu" aria-expanded="false">☰</button><nav><a href="index.html">Home</a><a href="products.html">Products</a><a href="cart.html">Cart <b class="count">0</b></a><a href="login.html">Login</a><a class="navbtn" href="register.html">Create account</a></nav></header><main class="wrap"><div class="title left"><label class="eyebrow">ALMOST YOURS</label><h1>Checkout</h1><p>Enter your details to complete this demo order.</p></div><div class="cartlayout"><section class="formcard"><form id="checkout" class="formgrid"><h3 class="full">Contact information</h3><div class="field full"><label for="cname">Full name</label><input id="cname" required minlength="3"></div><div class="field"><label for="email">Email</label><input id="email" type="email" required></div><div class="field"><label for="phone">Phone</label><input id="phone" type="tel" pattern="[0-9+() -]{7,20}" required placeholder="+92 300 1234567"></div><h3 class="full">Delivery address</h3><div class="field full"><label for="address">Street address</label><input id="address" required minlength="5"></div><div class="field"><label for="city">City</label><input id="city" required></div><div class="field"><label for="postal">Postal code</label><input id="postal" pattern="[0-9A-Za-z -]{3,10}" required></div><h3 class="full">Payment method</h3><div class="field full"><label for="payment">Choose payment</label><select id="payment" required><option value="">Select a method</option><option>Cash on delivery</option><option>Bank transfer (demo)</option></select></div><div class="field full"><bu
